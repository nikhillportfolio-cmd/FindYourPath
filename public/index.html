<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Path - Student Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom animations */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .fade-out { animation: fadeOut 0.4s ease-in forwards; }
        .slide-up { animation: slideUp 0.6s ease-out forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: scale(0.98); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Style scrollbar for BRIGHT theme */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #f8fafc; } /* slate-50 */
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; } /* slate-300 */
        ::-webkit-scrollbar-thumb:hover { background: #818cf8; } /* indigo-400 */
    </style>
</head>
<body class="bg-gradient-to-br from-sky-100 via-indigo-50 to-purple-100 text-slate-800 flex items-center justify-center min-h-screen p-4 font-sans">

    <!-- Main Container: Now uses soft white, rounded corners, and a cheerful shadow -->
    <div class="bg-white/90 backdrop-blur-sm p-8 md:p-10 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.08)] max-w-2xl w-full transition-all duration-500 border border-white">
        
        <!-- PHASE 1 -->
        <div id="interest-section" class="fade-in">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 text-center mb-3">What Drives You?</h1>
            <p class="text-slate-500 text-center mb-8 font-medium">Select your primary area of interest to discover your ideal career path.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Buttons updated to soft student-friendly cards -->
                <button onclick="startQuiz('TechAI')" class="p-6 bg-white rounded-2xl border-2 border-indigo-50 hover:border-indigo-400 hover:shadow-xl hover:shadow-indigo-100/50 hover:-translate-y-1.5 transition-all duration-300 group text-left">
                    <div class="text-4xl mb-3 transform group-hover:scale-110 transition-transform">🤖</div>
                    <h3 class="text-xl font-bold text-slate-700 group-hover:text-indigo-600 transition-colors">Tech & AI</h3>
                    <p class="text-sm text-slate-500 mt-2 font-medium">Software, AI, Cybersecurity.</p>
                </button>
                
                <button onclick="startQuiz('ContentMedia')" class="p-6 bg-white rounded-2xl border-2 border-indigo-50 hover:border-indigo-400 hover:shadow-xl hover:shadow-indigo-100/50 hover:-translate-y-1.5 transition-all duration-300 group text-left">
                    <div class="text-4xl mb-3 transform group-hover:scale-110 transition-transform">📱</div>
                    <h3 class="text-xl font-bold text-slate-700 group-hover:text-indigo-600 transition-colors">Content & Media</h3>
                    <p class="text-sm text-slate-500 mt-2 font-medium">YouTube, Writing, Journalism.</p>
                </button>

                <button onclick="startQuiz('Healthcare')" class="p-6 bg-white rounded-2xl border-2 border-indigo-50 hover:border-indigo-400 hover:shadow-xl hover:shadow-indigo-100/50 hover:-translate-y-1.5 transition-all duration-300 group text-left">
                    <div class="text-4xl mb-3 transform group-hover:scale-110 transition-transform">🩺</div>
                    <h3 class="text-xl font-bold text-slate-700 group-hover:text-indigo-600 transition-colors">Healthcare</h3>
                    <p class="text-sm text-slate-500 mt-2 font-medium">Medicine, Psychology, Research.</p>
                </button>

                <button onclick="startQuiz('LawAdmin')" class="p-6 bg-white rounded-2xl border-2 border-indigo-50 hover:border-indigo-400 hover:shadow-xl hover:shadow-indigo-100/50 hover:-translate-y-1.5 transition-all duration-300 group text-left">
                    <div class="text-4xl mb-3 transform group-hover:scale-110 transition-transform">🏛️</div>
                    <h3 class="text-xl font-bold text-slate-700 group-hover:text-indigo-600 transition-colors">Law & Admin</h3>
                    <p class="text-sm text-slate-500 mt-2 font-medium">Advocacy, UPSC, Civil Services.</p>
                </button>

                <button onclick="startQuiz('BusinessHustle')" class="p-6 bg-white rounded-2xl border-2 border-indigo-50 hover:border-indigo-400 hover:shadow-xl hover:shadow-indigo-100/50 hover:-translate-y-1.5 transition-all duration-300 group text-left">
                    <div class="text-4xl mb-3 transform group-hover:scale-110 transition-transform">🚀</div>
                    <h3 class="text-xl font-bold text-slate-700 group-hover:text-indigo-600 transition-colors">Business</h3>
                    <p class="text-sm text-slate-500 mt-2 font-medium">Startups, Management, Finance.</p>
                </button>

                <button onclick="startQuiz('ArtsDesign')" class="p-6 bg-white rounded-2xl border-2 border-indigo-50 hover:border-indigo-400 hover:shadow-xl hover:shadow-indigo-100/50 hover:-translate-y-1.5 transition-all duration-300 group text-left">
                    <div class="text-4xl mb-3 transform group-hover:scale-110 transition-transform">🎨</div>
                    <h3 class="text-xl font-bold text-slate-700 group-hover:text-indigo-600 transition-colors">Arts & Design</h3>
                    <p class="text-sm text-slate-500 mt-2 font-medium">Architecture, UX/UI, Fine Arts.</p>
                </button>
            </div>
        </div>

        <!-- PHASE 2 -->
        <div id="quiz-section" class="hidden">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 text-center mb-2">Find Your Path</h1>
            <p class="text-slate-500 text-center mb-8 font-medium">Answer a few questions honestly to unlock your roadmap.</p>
            
            <div class="w-full bg-indigo-50 rounded-full h-3 mb-8 shadow-inner">
                <!-- Progress bar uses a vibrant gradient -->
                <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-3 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>

            <h2 id="question-text" class="text-2xl font-bold mb-6 text-slate-800 leading-snug">Loading question...</h2>
            <div id="options-container" class="space-y-3">
                <!-- Dynamic options will be injected here with bright styles -->
            </div>
        </div>

        <!-- PHASE 3 -->
        <div id="result-section" class="hidden">
            <div class="mb-6 text-lg font-bold text-indigo-400 text-center tracking-[0.2em]">YOUR RESULTS</div>

            <!-- Main Match Card -->
            <div class="bg-gradient-to-br from-indigo-50 to-purple-50 p-6 md:p-8 rounded-3xl shadow-lg border-2 border-white mb-8 relative overflow-hidden">
                <div class="absolute top-0 right-0 bg-gradient-to-r from-amber-400 to-orange-400 text-white text-xs font-extrabold px-4 py-2 rounded-bl-2xl shadow-sm">#1 MATCH</div>
                <p class="text-sm font-bold text-indigo-500 uppercase tracking-wider mb-2">Your Ideal Career</p>
                <h2 id="primary-title" class="text-4xl font-extrabold text-slate-800 mt-1 mb-4 leading-tight"></h2>
                <p id="primary-desc" class="text-slate-600 text-base leading-relaxed font-medium"></p>
            </div>
            
            <h3 class="text-2xl font-bold mb-5 text-slate-800 flex items-center gap-2">📍 Your Step-by-Step Roadmap</h3>
            <div id="roadmap-phases" class="space-y-4 mb-10">
                <!-- Dynamic roadmap cards will be injected here -->
            </div>

            <!-- Also Consider Section -->
            <div class="mt-8 pt-8 border-t-2 border-indigo-50">
                <h3 class="text-lg font-bold mb-4 text-slate-500">Also Consider Exploring:</h3>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-5 hover:shadow-md transition-shadow">
                    <div id="secondary-icon" class="text-4xl bg-indigo-50 p-3 rounded-xl"></div>
                    <div>
                        <h4 id="secondary-title" class="font-bold text-slate-800 text-xl"></h4>
                        <p id="secondary-desc" class="text-sm text-slate-500 mt-1 font-medium"></p>
                    </div>
                </div>
            </div>

            <!-- Retake Button -->
            <button onclick="location.reload()" class="mt-10 w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold text-lg py-4 rounded-2xl hover:shadow-xl hover:shadow-indigo-200 hover:-translate-y-1 transition-all duration-300">
                Retake Assessment
            </button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
