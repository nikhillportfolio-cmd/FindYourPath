<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Blueprint Matcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom animations */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .fade-out { animation: fadeOut 0.4s ease-in forwards; }
        .slide-up { animation: slideUp 0.6s ease-out forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: scale(0.98); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Style scrollbar for dark theme */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1A1A1D; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #14B8A6; } 
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4 font-sans">

    <div class="bg-slate-900 p-8 rounded-2xl shadow-xl max-w-2xl w-full transition-all duration-500">
        
        <div id="interest-section" class="fade-in">
            <h1 class="text-3xl font-extrabold text-teal-400 text-center mb-2">What Drives You?</h1>
            <p class="text-slate-400 text-center mb-8">Select your primary area of interest to tailor your experience.</p>
            
            
               <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="startQuiz('TechAI')" class="p-6 bg-slate-800 rounded-xl border-2 border-slate-700 hover:border-teal-500 hover:-translate-y-1 transition-all duration-300 group text-left">
                    <div class="text-4xl mb-3">🤖</div>
                    <h3 class="text-xl font-bold text-slate-200 group-hover:text-teal-300 transition-colors">Tech & AI</h3>
                    <p class="text-sm text-slate-400 mt-2">Software, AI, Cybersecurity.</p>
                </button>
                
                <button onclick="startQuiz('ContentMedia')" class="p-6 bg-slate-800 rounded-xl border-2 border-slate-700 hover:border-teal-500 hover:-translate-y-1 transition-all duration-300 group text-left">
                    <div class="text-4xl mb-3">📱</div>
                    <h3 class="text-xl font-bold text-slate-200 group-hover:text-teal-300 transition-colors">Content & Media</h3>
                    <p class="text-sm text-slate-400 mt-2">YouTube, Writing, Journalism.</p>
                </button>

                <button onclick="startQuiz('Healthcare')" class="p-6 bg-slate-800 rounded-xl border-2 border-slate-700 hover:border-teal-500 hover:-translate-y-1 transition-all duration-300 group text-left">
                    <div class="text-4xl mb-3">🩺</div>
                    <h3 class="text-xl font-bold text-slate-200 group-hover:text-teal-300 transition-colors">Healthcare</h3>
                    <p class="text-sm text-slate-400 mt-2">Medicine, Psychology, Research.</p>
                </button>

                <button onclick="startQuiz('LawAdmin')" class="p-6 bg-slate-800 rounded-xl border-2 border-slate-700 hover:border-teal-500 hover:-translate-y-1 transition-all duration-300 group text-left">
                    <div class="text-4xl mb-3">🏛️</div>
                    <h3 class="text-xl font-bold text-slate-200 group-hover:text-teal-300 transition-colors">Law & Admin</h3>
                    <p class="text-sm text-slate-400 mt-2">Advocacy, UPSC, Civil Services.</p>
                </button>

                <button onclick="startQuiz('BusinessHustle')" class="p-6 bg-slate-800 rounded-xl border-2 border-slate-700 hover:border-teal-500 hover:-translate-y-1 transition-all duration-300 group text-left">
                    <div class="text-4xl mb-3">🚀</div>
                    <h3 class="text-xl font-bold text-slate-200 group-hover:text-teal-300 transition-colors">Business</h3>
                    <p class="text-sm text-slate-400 mt-2">Startups, Management, Finance.</p>
                </button>

                <button onclick="startQuiz('ArtsDesign')" class="p-6 bg-slate-800 rounded-xl border-2 border-slate-700 hover:border-teal-500 hover:-translate-y-1 transition-all duration-300 group text-left">
                    <div class="text-4xl mb-3">🎨</div>
                    <h3 class="text-xl font-bold text-slate-200 group-hover:text-teal-300 transition-colors">Arts & Design</h3>
                    <p class="text-sm text-slate-400 mt-2">Architecture, UX/UI, Fine Arts.</p>
                </button>
            </div>
        </div>

        <div id="quiz-section" class="hidden">
            <h1 class="text-3xl font-extrabold text-teal-400 text-center mb-2">Find Your Path</h1>
            <p class="text-slate-400 text-center mb-8">Answer a few questions to unlock your roadmap.</p>
            
            <div class="w-full bg-slate-800 rounded-full h-2.5 mb-8">
                <div id="progress-bar" class="bg-teal-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>

            <h2 id="question-text" class="text-xl font-bold mb-6 text-slate-200">Loading question...</h2>
            <div id="options-container" class="space-y-4">
                </div>
        </div>

        <div id="result-section" class="hidden">
            <div class="mb-6 text-xl font-bold text-teal-400 text-center tracking-widest">YOUR RESULTS</div>

            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border-2 border-teal-500/30 mb-6 relative overflow-hidden">
                <div class="absolute top-0 right-0 bg-teal-500 text-slate-950 text-xs font-bold px-3 py-1 rounded-bl-lg">#1 MATCH</div>
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Your Ideal Career</p>
                <h2 id="primary-title" class="text-3xl font-extrabold text-teal-300 mt-1 mb-3"></h2>
                <p id="primary-desc" class="text-slate-300 text-sm leading-relaxed"></p>
            </div>
            
            <h3 class="text-xl font-bold mb-4 text-slate-200">Your Step-by-Step Roadmap</h3>
            <div id="roadmap-phases" class="space-y-3 mb-8">
                </div>

            <div class="mt-8 pt-8 border-t border-slate-800">
                <h3 class="text-lg font-bold mb-4 text-slate-400">Also Consider:</h3>
                <div class="bg-slate-800/50 p-5 rounded-xl border border-slate-700 flex items-center gap-4">
                    <div id="secondary-icon" class="text-3xl"></div>
                    <div>
                        <h4 id="secondary-title" class="font-bold text-slate-200 text-lg"></h4>
                        <p id="secondary-desc" class="text-xs text-slate-400 mt-1"></p>
                    </div>
                </div>
            </div>

            <button onclick="location.reload()" class="mt-8 w-full bg-slate-950 border border-slate-700 text-white font-bold py-4 rounded-xl hover:bg-slate-800 hover:border-teal-500 transition-all">
                Retake Assessment
            </button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
